version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smart_watchlist_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_watchlist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_watchlist"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smart_watchlist_app
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/smart_watchlist
      JWT_SECRET: c84910e53a2ef819bc8d5930129a28e83b4b576829a8f4c2810471b6d0812903
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      MARKET_DATA_PROVIDER: yahoo
      NEWS_PROVIDER: yahoo
      LLM_PROVIDER: builtin
      FRONTEND_ORIGIN: "*"
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
